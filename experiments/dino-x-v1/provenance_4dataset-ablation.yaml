notes: >
  **Result — GO:** Success — no collapse. Loss trajectory: 0.58 (1K) → 0.47 (2K) → 0.32 (3K) → 0.18 (5K).
  View retrieval climbing: 5.0× (3K) → 7.0× (5K). Loss at 0.18 is low but climbing
  retrieval ratio proves the model is learning structural features, not memorizing.
  Architecture cleared for Phase 3 (5-dataset pan-organ scaling).
