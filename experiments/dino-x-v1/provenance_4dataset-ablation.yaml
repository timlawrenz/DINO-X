arm: 4dataset-ablation
hypothesis: >
  Anti-memorization interventions — KoLeo regularization (weight=0.1), aggressive
  random crop (scale_min=0.3), z-stride=3 (break Z-axis contiguous memory leak),
  and diverse batches (max one sample per series per batch) — prevent the
  catastrophic feature collapse observed at epoch 3 in prior 4-dataset multi-organ
  training.
falsified_if: >
  Loss drops below 0.1 (near-zero, indicating collapse) OR view retrieval ratio
  drops to 1.0× (no better than random) by epoch 3. Effectively: the same collapse
  pattern as the pre-ablation 4-dataset run recurs despite the interventions.
pre_registered_gate: >
  PASS if loss > 0.1 after 3,000 steps (avoiding collapse) AND view retrieval ratio
  ≥ 3.0× at step 5,000 AND no NaN events.
differs_from: two-organ-scale-aware
diff_summary: |
  - Datasets: 4 (LIDC, Pancreas, MSD-Hepatic, MSD-Colon) vs 2
  - Anti-memorization: KoLeo=0.1, crop_scale_min=0.3, z_stride=3, diverse_batches=true
  - Steps: 5,000
  - Effective batch: 128 (batch=32 × accum=4)
  - Hardware: RTX 2070 SUPER (8GB)
