architecture: vit-small
vit_patch: 14
vit_dim: 384
vit_depth: 12
vit_heads: 6
num_registers: 4
scale_aware: true

batch_size: 64
accumulation_steps: 4
effective_batch: 256

lr: 2.0e-4
min_lr: 1.0e-6
warmup_steps: 500
max_steps: 5000
optimizer: adamw

loss_dino: true
loss_gram: 1.0
loss_koleo: 0.1

ema_decay: 0.996
teacher_temp: 0.04
student_temp: 0.1
center_momentum: 0.9

img_size: 224
amp: fp16
seed: 42

datasets:
  - lidc-idri: 24441 slices, lung, spacing 0.46-0.98mm
  - pancreas-ct: 18942 slices, abdomen, spacing 0.6-0.98mm
