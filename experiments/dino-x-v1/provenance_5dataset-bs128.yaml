arm: 5dataset-bs128
hypothesis: >
  A ViT-Small trained on 5 pan-organ CT datasets (400K slices, 4 organs) with
  temperature-scaled sampling (T=2.0) and all anti-memorization constraints active
  can learn general-purpose representations that generalize across heterogeneous
  organ domains, as measured by view retrieval.
falsified_if: >
  View retrieval ratio drops below 5.0× at any checkpoint, OR NaN/Inf events
  occur, OR Entropy collapses to near-zero before 50K steps. Effectively: the
  model cannot handle 5 domains without collapsing.
pre_registered_gate: >
  PASS if view retrieval ratio ≥ 10.0× at step 50,000 AND no NaN events
  AND embedding stddev > 0 AND Gram mean < 1.0 (no collapse).
differs_from: 4dataset-ablation
diff_summary: |
  - Datasets: 5 (LIDC, Pancreas, CQ500 brain, MSD-Hepatic, MSD-Colon) vs 4
  - Total slices: 400K (T=2.0 sampled)
  - Steps: 50,000 (~53 epochs)
  - Effective batch: 128 (batch=32 × accum=4)
  - AMP: bfloat16 (no grad scaler)
  - Hardware: AMD Radeon 8060S (Strix Halo), ROCm 7.11
  - LR schedule: cosine 2e-4 → 1e-6, warmup=2,500
